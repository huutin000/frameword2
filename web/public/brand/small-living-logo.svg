  <text x="68" y="46" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-size="9.5" font-weight="600" letter-spacing="0.12em" fill="#786C5E">
    KHÔNG GIAN TINH GỌN 2026
  </text>
